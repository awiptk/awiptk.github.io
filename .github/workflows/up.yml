name: Download File from URL

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'URL file yang ingin diunduh'
        required: true
        type: string
      destination_folder:
        description: 'Folder tujuan di repo'
        required: true
        default: 'audio'
        type: string
      output_filename:
        description: 'Nama file output (dengan ekstensi, contoh: lagu.mp3)'
        required: true
        default: 'audio.mp3'
        type: string

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download file from URL
        run: |
          echo "🔗 Downloading from URL..."
          echo "Source: ${{ inputs.file_url }}"
          echo "Destination: ${{ inputs.destination_folder }}/${{ inputs.output_filename }}"
          echo ""
          
          # Buat folder jika belum ada
          mkdir -p "${{ inputs.destination_folder }}"
          
          # Download dengan curl
          curl -L --fail --max-time 600 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Accept: */*" \
            -H "Accept-Language: en-US,en;q=0.9" \
            --progress-bar \
            -o "${{ inputs.destination_folder }}/${{ inputs.output_filename }}" \
            "${{ inputs.file_url }}" || {
              echo ""
              echo "❌ Download failed!"
              echo ""
              echo "Possible reasons:"
              echo "- URL expired or invalid"
              echo "- Network timeout"
              echo "- File requires authentication"
              exit 1
            }
          
          echo ""
          echo "✅ Download completed!"

      - name: Verify downloaded file
        run: |
          FILE_PATH="${{ inputs.destination_folder }}/${{ inputs.output_filename }}"
          
          echo "📊 File information:"
          ls -lh "$FILE_PATH"
          
          # Cek ukuran file
          FILE_SIZE=$(stat -c%s "$FILE_PATH")
          FILE_SIZE_KB=$(echo "scale=0; $FILE_SIZE / 1024" | bc)
          FILE_SIZE_MB=$(echo "scale=2; $FILE_SIZE / 1024 / 1024" | bc)
          
          echo ""
          echo "File size: $FILE_SIZE bytes"
          echo "File size: $FILE_SIZE_KB KB"
          echo "File size: $FILE_SIZE_MB MB"
          
          # Validasi ukuran minimum (10 KB)
          if [ "$FILE_SIZE" -lt 10240 ]; then
            echo ""
            echo "❌ Error: File too small (< 10 KB)"
            echo "File might be an error page or incomplete download"
            echo ""
            echo "File content preview:"
            head -c 500 "$FILE_PATH"
            exit 1
          fi
          
          # Cek tipe file
          echo ""
          echo "File type:"
          file "$FILE_PATH"
          
          # Simpan info untuk summary
          echo "FILE_SIZE_MB=$FILE_SIZE_MB" >> $GITHUB_ENV
          echo "FILE_PATH=$FILE_PATH" >> $GITHUB_ENV
          
          echo ""
          echo "✅ File verification passed!"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "📝 Adding file to git..."
          git add "${{ inputs.destination_folder }}/${{ inputs.output_filename }}"
          
          echo ""
          echo "📊 Git status:"
          git status --short
          
          if git diff --staged --quiet; then
            echo ""
            echo "⚠️ No changes to commit (file might already exist with same content)"
          else
            echo ""
            echo "💾 Committing changes..."
            git commit -m "📥 Add file: ${{ inputs.output_filename }}"
            
            echo ""
            echo "📤 Pushing to repository..."
            git push
            
            echo ""
            echo "✅ File successfully uploaded to repository!"
          fi

      - name: Summary
        if: always()
        run: |
          echo "### 📥 Download Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "$FILE_PATH" ] && [ -f "$FILE_PATH" ]; then
            echo "✅ **Status:** Success" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Source URL:** \`${{ inputs.file_url }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Saved to:** \`${{ inputs.destination_folder }}/${{ inputs.output_filename }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **File size:** $FILE_SIZE_MB MB" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 File berhasil diupload ke repository!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download gagal. Periksa log di atas untuk detail error." >> $GITHUB_STEP_SUMMARY
          fi
