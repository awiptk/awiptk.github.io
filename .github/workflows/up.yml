name: Upload File from URL to Repo

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'URL file yang ingin diunduh (contoh: https://example.com/audio.mp3)'
        required: true
        type: string
      destination_folder:
        description: 'Folder tujuan di repo (contoh: audio)'
        required: true
        default: 'audio'
        type: string

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup folder & download file
        run: |
          echo "URL: ${{ inputs.file_url }}"
          echo "Folder: ${{ inputs.destination_folder }}"

          mkdir -p "${{ inputs.destination_folder }}"

          filename=$(basename "${{ inputs.file_url }}")
          curl -L -o "${{ inputs.destination_folder }}/$filename" "${{ inputs.file_url }}"

          echo "✅ File downloaded to ${{ inputs.destination_folder }}/$filename"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.destination_folder }}"
          git commit -m "Upload file from URL: ${{ inputs.file_url }}" || echo "⚠️ No changes to commit"
          git push