name: Upload Audio from URL

on:
  workflow_dispatch:  # Bisa dijalankan manual dari GitHub UI

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Download file from URL
        run: |
          mkdir -p audio
          curl -L -o audio/audio.mp3 "https://example.com/audio.mp3"

      - name: Commit and push if changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio/audio.mp3
          git commit -m "Add audio from URL" || echo "No changes to commit"
          git push