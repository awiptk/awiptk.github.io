name: Download YouTube Audio to Repo

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'URL YouTube video (contoh: https://youtube.com/watch?v=xxxxx)'
        required: true
        type: string
      destination_folder:
        description: 'Folder tujuan di repo (contoh: audio)'
        required: true
        default: 'audio'
        type: string
      output_filename:
        description: 'Nama file output tanpa ekstensi (contoh: lagu-favorit)'
        required: true
        default: 'audio'
        type: string
      audio_format:
        description: 'Format audio (mp3, m4a, wav, opus)'
        required: true
        default: 'mp3'
        type: choice
        options:
          - mp3
          - m4a
          - wav
          - opus
      audio_quality:
        description: 'Kualitas audio (best, 320K, 256K, 192K, 128K)'
        required: true
        default: 'best'
        type: choice
        options:
          - best
          - 320K
          - 256K
          - 192K
          - 128K

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install yt-dlp and ffmpeg
        run: |
          echo "📦 Installing dependencies..."
          pip install -U yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          
          echo "✅ yt-dlp version:"
          yt-dlp --version

      - name: Setup cookies (if available)
        run: |
          if [ -n "${{ secrets.YOUTUBE_COOKIES }}" ]; then
            echo "🍪 Setting up YouTube cookies..."
            echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
            echo "✅ Cookies file created"
          else
            echo "⚠️ No cookies found - attempting without authentication"
          fi

      - name: Download audio from YouTube
        run: |
          echo "🎵 Starting download..."
          echo "URL: ${{ inputs.youtube_url }}"
          echo "Destination: ${{ inputs.destination_folder }}"
          echo "Filename: ${{ inputs.output_filename }}"
          echo "Format: ${{ inputs.audio_format }}"
          echo "Quality: ${{ inputs.audio_quality }}"
          echo ""
          
          mkdir -p "${{ inputs.destination_folder }}"
          
          # Siapkan opsi yt-dlp
          YTDLP_OPTS="--no-check-certificates --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'"
          
          # Tambahkan cookies jika ada
          if [ -f cookies.txt ]; then
            YTDLP_OPTS="$YTDLP_OPTS --cookies cookies.txt"
            echo "🍪 Using cookies for authentication"
          fi
          
          echo "⬇️ Downloading audio..."
          
          # Download dengan opsi bypass bot detection
          if [ "${{ inputs.audio_quality }}" = "best" ]; then
            yt-dlp -x --audio-format ${{ inputs.audio_format }} \
              --audio-quality 0 \
              $YTDLP_OPTS \
              --no-playlist \
              --extractor-args "youtube:player_client=android" \
              --extractor-args "youtube:skip=dash,hls" \
              -o "${{ inputs.destination_folder }}/${{ inputs.output_filename }}.%(ext)s" \
              "${{ inputs.youtube_url }}" || {
                echo "❌ yt-dlp download failed!"
                echo ""
                echo "💡 Tip: Video mungkin memerlukan cookies YouTube."
                echo "Lihat instruksi di bawah untuk setup cookies."
                exit 1
              }
          else
            yt-dlp -x --audio-format ${{ inputs.audio_format }} \
              --audio-quality ${{ inputs.audio_quality }} \
              $YTDLP_OPTS \
              --no-playlist \
              --extractor-args "youtube:player_client=android" \
              --extractor-args "youtube:skip=dash,hls" \
              -o "${{ inputs.destination_folder }}/${{ inputs.output_filename }}.%(ext)s" \
              "${{ inputs.youtube_url }}" || {
                echo "❌ yt-dlp download failed!"
                echo ""
                echo "💡 Tip: Video mungkin memerlukan cookies YouTube."
                echo "Lihat instruksi di bawah untuk setup cookies."
                exit 1
              }
          fi
          
          echo ""
          echo "✅ Download completed!"

      - name: Cleanup cookies
        if: always()
        run: |
          if [ -f cookies.txt ]; then
            rm -f cookies.txt
            echo "🧹 Cookies cleaned up"
          fi

      - name: Verify downloaded file
        run: |
          echo "📂 Checking folder contents..."
          ls -la "${{ inputs.destination_folder }}/"
          
          echo ""
          echo "🔍 Looking for downloaded file..."
          
          # Cari file yang baru di-download
          if [ -f "${{ inputs.destination_folder }}/${{ inputs.output_filename }}.${{ inputs.audio_format }}" ]; then
            FILE="${{ inputs.destination_folder }}/${{ inputs.output_filename }}.${{ inputs.audio_format }}"
          else
            FILE=$(find "${{ inputs.destination_folder }}" -name "${{ inputs.output_filename }}*" -type f | head -n 1)
          fi
          
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "❌ Error: File not found!"
            exit 1
          fi
          
          echo "📊 File found: $FILE"
          ls -lh "$FILE"
          
          FILE_SIZE=$(stat -c%s "$FILE")
          FILE_SIZE_MB=$(echo "scale=2; $FILE_SIZE / 1024 / 1024" | bc)
          
          echo "File size: $FILE_SIZE bytes ($FILE_SIZE_MB MB)"
          
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "❌ Error: File too small"
            exit 1
          fi
          
          echo "AUDIO_FILE=$FILE" >> $GITHUB_ENV
          echo "FILE_SIZE_MB=$FILE_SIZE_MB" >> $GITHUB_ENV
          
          echo "✅ File verification passed"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add "${{ inputs.destination_folder }}/"
          
          if git diff --staged --quiet; then
            echo "⚠️ No changes to commit"
          else
            git commit -m "🎵 Add audio: ${{ inputs.output_filename }}"
            git push
            echo "✅ Changes pushed successfully!"
          fi

      - name: Summary
        if: always()
        run: |
          echo "### 🎉 Download Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Source:** ${{ inputs.youtube_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Format:** ${{ inputs.audio_format }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Quality:** ${{ inputs.audio_quality }}" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "$AUDIO_FILE" ]; then
            echo "- **Location:** \`$AUDIO_FILE\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Size:** $FILE_SIZE_MB MB" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Status:** Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Status:** Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🍪 Cara Setup YouTube Cookies (Opsional)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Jika video memerlukan login YouTube:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. Install extension **Get cookies.txt LOCALLY** di browser" >> $GITHUB_STEP_SUMMARY
            echo "2. Login ke YouTube" >> $GITHUB_STEP_SUMMARY
            echo "3. Klik extension dan export cookies untuk youtube.com" >> $GITHUB_STEP_SUMMARY
            echo "4. Buka **Settings → Secrets and variables → Actions**" >> $GITHUB_STEP_SUMMARY
            echo "5. Buat secret baru bernama \`YOUTUBE_COOKIES\`" >> $GITHUB_STEP_SUMMARY
            echo "6. Paste isi file cookies.txt" >> $GITHUB_STEP_SUMMARY
          fi
