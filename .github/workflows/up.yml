name: Download YouTube Audio to Repo

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'URL YouTube video (contoh: https://youtube.com/watch?v=xxxxx)'
        required: true
        type: string
      youtube_cookies:
        description: 'YouTube Cookies (opsional, dalam format: COOKIE1=value1; COOKIE2=value2)'
        required: false
        type: string
      destination_folder:
        description: 'Folder tujuan di repo (contoh: audio)'
        required: true
        default: 'audio'
        type: string
      output_filename:
        description: 'Nama file output tanpa ekstensi (contoh: lagu-favorit)'
        required: true
        default: 'audio'
        type: string
      audio_format:
        description: 'Format audio (mp3, m4a, wav, opus)'
        required: true
        default: 'mp3'
        type: choice
        options:
          - mp3
          - m4a
          - wav
          - opus
      audio_quality:
        description: 'Kualitas audio (best, 320K, 256K, 192K, 128K)'
        required: true
        default: 'best'
        type: choice
        options:
          - best
          - 320K
          - 256K
          - 192K
          - 128K

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install yt-dlp and ffmpeg
        run: |
          echo "📦 Installing dependencies..."
          pip install -U yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          
          echo "✅ yt-dlp version:"
          yt-dlp --version

      - name: Setup cookies
        run: |
          # Cek cookies dari input atau secrets
          if [ -n "${{ inputs.youtube_cookies }}" ]; then
            echo "🍪 Converting cookies from input..."
            
            # Convert format cookies browser ke Netscape format
            cat > cookies.txt << 'EOF'
          # Netscape HTTP Cookie File
          .youtube.com	TRUE	/	TRUE	2147483647	CONSENT	YES+cb
          EOF
            
            # Parse cookies dari input (format: KEY=VALUE; KEY2=VALUE2)
            echo "${{ inputs.youtube_cookies }}" | tr ';' '\n' | while IFS='=' read -r key value; do
              key=$(echo "$key" | xargs)
              value=$(echo "$value" | xargs)
              if [ -n "$key" ] && [ -n "$value" ]; then
                echo ".youtube.com	TRUE	/	TRUE	2147483647	$key	$value" >> cookies.txt
              fi
            done
            
            echo "✅ Cookies file created from input"
            
          elif [ -n "${{ secrets.YOUTUBE_COOKIES }}" ]; then
            echo "🍪 Using cookies from secrets..."
            echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
            echo "✅ Cookies file created from secrets"
          else
            echo "⚠️ No cookies provided - will attempt without authentication"
          fi

      - name: Download audio from YouTube
        run: |
          echo "🎵 Starting download..."
          echo "URL: ${{ inputs.youtube_url }}"
          echo "Destination: ${{ inputs.destination_folder }}"
          echo "Filename: ${{ inputs.output_filename }}"
          echo "Format: ${{ inputs.audio_format }}"
          echo "Quality: ${{ inputs.audio_quality }}"
          echo ""
          
          mkdir -p "${{ inputs.destination_folder }}"
          
          echo "⬇️ Downloading audio..."
          
          # Opsi dasar yt-dlp
          YTDLP_CMD="yt-dlp -x --audio-format ${{ inputs.audio_format }}"
          
          # Tambahkan quality
          if [ "${{ inputs.audio_quality }}" = "best" ]; then
            YTDLP_CMD="$YTDLP_CMD --audio-quality 0"
          else
            YTDLP_CMD="$YTDLP_CMD --audio-quality ${{ inputs.audio_quality }}"
          fi
          
          # Tambahkan opsi lain
          YTDLP_CMD="$YTDLP_CMD --no-playlist --no-check-certificates"
          
          # Tambahkan cookies jika ada
          if [ -f cookies.txt ]; then
            YTDLP_CMD="$YTDLP_CMD --cookies cookies.txt"
            # Gunakan web client jika pakai cookies
            YTDLP_CMD="$YTDLP_CMD --extractor-args 'youtube:player_client=web'"
            echo "🍪 Using cookies with web client"
          else
            # Gunakan android client jika tanpa cookies
            YTDLP_CMD="$YTDLP_CMD --extractor-args 'youtube:player_client=android'"
            echo "📱 Using android client (no cookies)"
          fi
          
          # Tambahkan opsi format fallback
          YTDLP_CMD="$YTDLP_CMD --format 'bestaudio/best'"
          
          # Output filename
          YTDLP_CMD="$YTDLP_CMD -o '${{ inputs.destination_folder }}/${{ inputs.output_filename }}.%(ext)s'"
          
          # Jalankan download
          eval $YTDLP_CMD "'${{ inputs.youtube_url }}'" || {
            echo ""
            echo "❌ Download failed!"
            echo ""
            if [ ! -f cookies.txt ]; then
              echo "💡 Tip: Video ini mungkin memerlukan cookies YouTube."
              echo "Coba masukkan cookies di field 'YouTube Cookies' saat run workflow."
            fi
            exit 1
          }
          
          echo ""
          echo "✅ Download completed!"

      - name: Cleanup cookies
        if: always()
        run: |
          if [ -f cookies.txt ]; then
            rm -f cookies.txt
            echo "🧹 Cookies cleaned up"
          fi

      - name: Verify downloaded file
        run: |
          echo "📂 Checking folder contents..."
          ls -la "${{ inputs.destination_folder }}/" || true
          
          echo ""
          echo "🔍 Looking for downloaded file..."
          
          # Cari file yang baru di-download
          FILE=$(find "${{ inputs.destination_folder }}" -name "${{ inputs.output_filename }}*" -type f -newer /proc/1/stat 2>/dev/null | head -n 1)
          
          if [ -z "$FILE" ]; then
            # Fallback: cari file dengan nama yang sesuai
            FILE=$(find "${{ inputs.destination_folder }}" -name "${{ inputs.output_filename }}*" -type f | head -n 1)
          fi
          
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "❌ Error: File not found!"
            echo ""
            echo "Expected pattern: ${{ inputs.destination_folder }}/${{ inputs.output_filename }}*"
            echo ""
            echo "Files in directory:"
            find "${{ inputs.destination_folder }}" -type f 2>/dev/null || echo "No files found"
            exit 1
          fi
          
          echo "📊 File found: $FILE"
          ls -lh "$FILE"
          
          FILE_SIZE=$(stat -c%s "$FILE")
          FILE_SIZE_KB=$(echo "scale=0; $FILE_SIZE / 1024" | bc)
          FILE_SIZE_MB=$(echo "scale=2; $FILE_SIZE / 1024 / 1024" | bc)
          
          echo "File size: $FILE_SIZE bytes ($FILE_SIZE_KB KB / $FILE_SIZE_MB MB)"
          
          if [ "$FILE_SIZE" -lt 10000 ]; then
            echo "❌ Error: File too small (< 10KB), likely failed download"
            cat "$FILE" 2>/dev/null || true
            exit 1
          fi
          
          echo "AUDIO_FILE=$FILE" >> $GITHUB_ENV
          echo "FILE_SIZE_MB=$FILE_SIZE_MB" >> $GITHUB_ENV
          
          echo "✅ File verification passed"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "📝 Adding files to git..."
          git add "${{ inputs.destination_folder }}/"
          
          echo "📊 Git status:"
          git status --short
          
          if git diff --staged --quiet; then
            echo "⚠️ No changes to commit"
          else
            echo "💾 Committing changes..."
            git commit -m "🎵 Add audio: ${{ inputs.output_filename }}"
            
            echo "📤 Pushing to repository..."
            git push
            
            echo "✅ Changes pushed successfully!"
          fi

      - name: Summary
        if: always()
        run: |
          echo "### 🎉 Download Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Source:** ${{ inputs.youtube_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Format:** ${{ inputs.audio_format }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Quality:** ${{ inputs.audio_quality }}" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "$AUDIO_FILE" ]; then
            echo "- **Location:** \`$AUDIO_FILE\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Size:** $FILE_SIZE_MB MB" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Status:** Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Status:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
